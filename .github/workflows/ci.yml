name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
          targets: aarch64-apple-darwin
      - name: Install sandbox prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          set -eu
          # This step has hung for hours on the runner rather than failing,
          # blocking merges and releases while every other step takes
          # seconds. Bound each apt call so a hang becomes a retry instead
          # of an unbounded wait, and retry a few times so a transient
          # mirror problem heals itself.
          install_prereqs() {
            timeout 300 sudo apt-get update -o Acquire::Retries=3 || return 1
            timeout 300 sudo apt-get install -y -o Acquire::Retries=3 \
              bubblewrap build-essential || return 1
          }
          for attempt in 1 2 3; do
            if install_prereqs; then
              exit 0
            fi
            echo "::warning title=apt retry::attempt $attempt hung or failed; retrying"
            sleep 10
          done
          echo "apt failed after 3 attempts" >&2
          exit 1
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Check macOS target
        run: cargo clippy --locked --target aarch64-apple-darwin --all-targets -- -D warnings

  nix:
    # The Nix build path had no CI coverage, so two NixOS regressions reached
    # users: v1.19.0 refused its own bwrap (#114), and flake changes could
    # only ever be validated by the reporter. `nix flake check` builds the
    # package and runs its checkPhase, which is the same suite CI runs above.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: nix flake check
        run: nix flake check --print-build-logs
