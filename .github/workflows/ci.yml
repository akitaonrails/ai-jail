name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
          targets: aarch64-apple-darwin, x86_64-unknown-linux-musl
      - name: Install sandbox prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          set -eu
          # This step has hung for hours on the runner rather than failing,
          # blocking merges and releases while every other step takes
          # seconds. Bound each apt call so a hang becomes a retry instead
          # of an unbounded wait, and retry a few times so a transient
          # mirror problem heals itself.
          install_prereqs() {
            timeout 300 sudo apt-get update -o Acquire::Retries=3 || return 1
            timeout 300 sudo apt-get install -y -o Acquire::Retries=3 \
              bubblewrap build-essential || return 1
          }
          for attempt in 1 2 3; do
            if install_prereqs; then
              exit 0
            fi
            echo "::warning title=apt retry::attempt $attempt hung or failed; retrying"
            sleep 10
          done
          echo "apt failed after 3 attempts" >&2
          exit 1
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Check macOS target
        run: cargo clippy --locked --target aarch64-apple-darwin --all-targets -- -D warnings
      # musl types some libc constants differently from glibc — TIOCSCTTY and
      # TIOCSTI are c_int there and c_ulong here — so ai-jail stopped building
      # on Alpine without anything on the glibc runner noticing (#127). This
      # is a type check, not a link: no musl toolchain is needed.
      - name: Check musl target
        run: cargo check --locked --target x86_64-unknown-linux-musl --all-targets

  macos:
    # `src/sandbox/seatbelt.rs` is `#[cfg(target_os = "macos")]`, so the Linux
    # job only ever compiles its tests (through the cross-target clippy step).
    # Executing them used to happen on tag push, until a09179b (v1.18.0) split
    # the release matrix and left the macOS leg building without testing. Every
    # seatbelt test written after that was merged unrun, and 26 of them failed
    # the first time this job ran.
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
      - run: cargo test --locked

  nix:
    # The Nix build path had no CI coverage, so NixOS regressions reached
    # users (#114) and flake changes could only be validated by whoever sent
    # them.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          # crates.io rejects any User-Agent containing the `curl/` token, and
          # nixpkgs' fetchurl identifies itself as
          # "curl/$curlVersion Nixpkgs/$nixpkgsVersion", so every crate fetch
          # is refused with a 403 and the build cannot vendor anything.
          # Measured against the download endpoint:
          #   curl/8.16.0 Nixpkgs/25.11 -> 403
          #   Nixpkgs/25.11             -> 200
          #
          # fetchurl's builder appends $NIX_CURL_FLAGS last and curl honours
          # the final --user-agent, so this replaces the blocked UA without
          # patching nixpkgs. NIX_CURL_FLAGS is already in fetchurl's
          # impureEnvVars; impure-env is how a client passes it to the daemon.
          # The value must be one shell word — the builder expands it unquoted.
          #
          # Only the request header changes: these are fixed-output
          # derivations, so sha256 still pins exactly what is fetched. Remove
          # once nixpkgs stops sending a UA that crates.io blocks.
          extra_nix_config: |
            experimental-features = nix-command flakes configurable-impure-env
            impure-env = NIX_CURL_FLAGS=--user-agent=Nixpkgs-ai-jail
      # `flake check` realizes `checks.*` only. It reports the package as
      # "derivation evaluated to ...ai-jail.drv" and stops there, so on its
      # own this job proves the formatting hooks pass and nothing else.
      - name: nix flake check
        run: nix flake check --print-build-logs
      # The build is what actually exercises the flake: buildRustPackage
      # compiles the crate and runs the test suite in its checkPhase.
      - name: nix build
        run: nix build .#default --print-build-logs
      # #116 removed the Rust toolchain from the runtime closure by building
      # with a minimal rustc/cargo and remapping store paths out of the
      # binary. Both halves are easy to undo by accident — switching the
      # package back to the aggregated `rust` derivation is a one-line edit —
      # and the result still builds and tests clean, so only the closure
      # shows it. Bubblewrap is a genuine runtime dependency and stays.
      - name: Runtime closure carries no toolchain
        run: |
          set -eu
          closure="$(nix path-info -r .#default)"
          if leaked="$(printf '%s\n' "$closure" |
              grep -E -- '-(rustc|cargo|clippy-preview|rustfmt-preview|rust-analyzer-preview|rust-src|rust-docs|rust-std|rust-default|llvm-tools-preview)-')"; then
            echo "::error::Rust toolchain leaked into the runtime closure" >&2
            printf '%s\n' "$leaked" >&2
            exit 1
          fi
          printf '%s\n' "$closure" | wc -l | xargs echo "runtime closure paths:"
